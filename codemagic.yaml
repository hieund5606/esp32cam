workflows:
  ios-ipa-unsigned:
    name: Smoke Detector - IPA with Notifications
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/cli
          npm install @capacitor/local-notifications

      - name: Add iOS platform
        script: |
          npx cap add ios

      - name: Sync plugins
        script: |
          npx cap sync ios

      - name: Patch Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          echo "=== Patching $PLIST ==="
          
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" 2>/dev/null || true
          
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Ung dung can truy cap mang noi bo de ket noi voi ESP32'" "$PLIST" 2>/dev/null || true
          
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string '_http._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string '_https._tcp'" "$PLIST" 2>/dev/null || true
          
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string 'fetch'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string 'processing'" "$PLIST" 2>/dev/null || true
          
          echo "=== Verify ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -A3 -E "NSAppTransportSecurity|NSLocalNetwork|NSBonjour|UIBackgroundModes" || true

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Build unsigned archive
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        script: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r SmokeDetector.ipa Payload
          ls -la
          echo "✅ IPA created"

    artifacts:
      - ios/App/build/*.ipa
      - ios/App/build/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
