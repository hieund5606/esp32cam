workflows:
  ios-ipa-unsigned:
    name: Smoke Detector - IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/cli

      - name: Add iOS platform
        script: |
          npx cap add ios

      - name: Sync web assets
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Build unsigned archive
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        script: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r SmokeDetector.ipa Payload
          ls -la
          echo "✅ IPA created: $(pwd)/SmokeDetector.ipa"

    artifacts:
      - ios/App/build/*.ipa
      - ios/App/build/*.xcarchive
      - /tmp/xcodebuild_logs/*.log