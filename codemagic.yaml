workflows:
  ios-unsigned:
    name: Smoke Detector - Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Add iOS platform
        script: |
          npx cap add ios

      - name: Sync web assets
        script: |
          npx cap sync ios

      - name: Build unsigned archive
        script: |
          cd ios/App
          pod install
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/ios/App/build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcpretty
    artifacts:
      - ios/App/build/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
