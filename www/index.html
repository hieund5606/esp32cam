    <div class="config-card">
      <div class="config-title">🔔 Thông báo cảnh báo</div>
      
      <div class="notif-row">
        <div class="notif-label">
          <span class="notif-name">Bật thông báo</span>
          <span class="notif-desc">Nhận cảnh báo khi có khói</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="notifEnabled" onchange="toggleNotifications()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="notif-row">
        <div class="notif-label">
          <span class="notif-name">Rung</span>
          <span class="notif-desc">Rung khi có cảnh báo</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="notifVibrate" onchange="saveNotifSettings()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="notif-row">
        <div class="notif-label">
          <span class="notif-name">Âm thanh</span>
          <span class="notif-desc">Phát tiếng khi cảnh báo</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="notifSound" onchange="saveNotifSettings()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="config-row" style="margin-top: 12px;">
        <label>Chống spam (giây) — không thông báo lại trong khoảng này</label>
        <input type="number" id="notifCooldown" min="10" max="600" value="60" onchange="saveNotifSettings()">
      </div>

      <button class="btn btn-warn" onclick="testNotification()">🔔 TEST THÔNG BÁO</button>
      <button class="btn btn-secondary" onclick="checkPermission()">🔐 KIỂM TRA QUYỀN</button>
    </div>
